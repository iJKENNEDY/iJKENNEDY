<section id="contact" class="w-full max-w-3xl mx-auto bg-section-bg rounded-2xl shadow-xl p-10 mb-12 border border-border">
    <h2 class="font-titles text-2xl text-title mb-2 text-center">Let's Build Something Together</h2>
    <p class="font-body text-secondary mb-8 text-center">
        Have an idea for an AI system, need a technical partner, or want to collaborate on research? Let's talk.
    </p>
    <form id="contactForm" action="https://formspree.io/f/mjkogkkp" method="POST" class="flex flex-col gap-5">
        <input type="text" name="name" placeholder="Your Name" required
            id="contact-name"
            class="p-4 rounded-xl border border-border font-body bg-background text-text text-lg focus:border-primary focus:ring-2 focus:ring-primary transition w-full" />
        <input type="email" name="email" placeholder="Your Email" required
            id="contact-email"
            class="p-4 rounded-xl border border-border font-body bg-background text-text text-lg focus:border-primary focus:ring-2 focus:ring-primary transition w-full" />
        <textarea name="message" placeholder="Tell me about your project or idea..." required
            id="contact-message"
            class="p-4 rounded-xl border border-border font-body bg-background text-text text-lg focus:border-primary focus:ring-2 focus:ring-primary transition w-full min-h-[120px] resize-none"></textarea>
        <button type="submit"
            id="contact-submit"
            class="bg-primary text-white font-titles text-lg p-4 rounded-xl hover:bg-accent hover:text-background transition shadow-neon-primary w-full flex items-center justify-center gap-2">
            <i class="fas fa-paper-plane"></i> Send Message
        </button>
        <div id="formMessage" class="hidden mt-2 p-4 rounded-xl font-body text-lg text-center bg-background border border-accent text-accent"></div>
    </form>
</section>
